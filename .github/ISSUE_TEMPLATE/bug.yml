name: Bug report
description: Report a reproducible Agent Micro app problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Remove session IDs, usernames, profile contents, and personal paths before submitting.
  - type: input
    id: version
    attributes:
      label: Agent Micro version or commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
